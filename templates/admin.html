<!DOCTYPE html>
<!-- saved from url=(0028) -->
<html lang="ru"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <title>Учебный демо-сайт: DOM XSS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Подключаем внешний CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="card__header">
        <h1>Admin - flag123_456</h1>
        <p class="subtitle">Страница берёт значение из URL и отображает результат поиска.</p>
      </div>

      <form class="form" method="get" action="">
        <div class="input-wrap">
          <label for="q">Запрос</label>
          <input id="q" name="q" type="text" placeholder="Например: hello">
        </div>
        <button type="submit">Искать</button>
      </form>

      <div class="divider"></div>

      <div class="output">
        <div id="output">Здесь появится результат поиска.</div>
      </div>
    </div>
  </div>

  <script>

    const params = new URLSearchParams(window.location.search);
    const q = params.get("q");
    if (q) {

      document.getElementById("output").innerHTML = 'Результаты по запросу: ' + q;
    }

  </script>



</body></html>
